<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Tianma Work OS</title><link rel="stylesheet" href="/static_cockpit/workbench/styles.css?BUILD"><script src="/static_cockpit/workbench/markdown.js?BUILD" defer></script><script src="/static_cockpit/workbench/delivery.js?BUILD" defer></script><script id="workbench-script" data-catalog="/static_cockpit/workbench/catalog.json?BUILD" src="/static_cockpit/workbench/app.js?BUILD" defer></script></head><body><div class="shell"><header class="header"><button class="brand" data-action="home"><span class="logo">TW</span>Tianma Work OS</button><div class="grow"></div><div class="pane-restore" id="pane-controls"></div><label for="lang" id="language-label">Language</label><select id="lang"><option value="en">English</option><option value="zh">简体中文</option></select><button class="account" id="account" data-action="account" hidden>TW</button></header><section id="auth-screen" class="auth-screen"><p>Loading… / 正在加载…</p></section><nav id="mobile-tabs" class="mobile-tabs" hidden></nav><div id="workspace" class="workspace home-layout landing" data-mobile="center" hidden><aside class="left"><div class="left-top"><span class="label" data-i18n="projects"></span></div><div class="sidebar-actions"><button data-action="new-project" data-i18n="newProject"></button><button data-action="import-project" data-i18n="importProject"></button></div><div id="tree"></div><div class="sidebar-bottom" data-i18n="localNote"></div></aside><div class="gutter a" data-resize="left" role="separator" aria-label="Resize projects" tabindex="0"></div><main class="center"><div class="projectbar"><h1 id="project-name"></h1></div><nav id="nav" class="topnav"></nav><div id="conversation-heading" class="conversation-heading"></div><div id="chat-region" class="chat-region"><div id="welcome"></div><div id="messages" class="messages"></div></div><di
