<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Codex · TWOS</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><strong>Codex</strong><small id="binding">Local conversation · official protocol</small></div><button id="connect">Connect local Codex</button><button id="reconnect" hidden>Reconnect</button><button id="refresh" aria-label="Refresh">↻</button></header>
<section class="selector"><label for="threads" id="thread-label">Conversation</label><select id="threads"><option value="">Choose existing conversation</option></select><button id="more-threads" hidden>More</button><p id="cwd"></p><button id="workspace" hidden>Open workspace</button></section>
<div id="notice" role="status" hidden><span id="notice-text"></span><details id="notice-details" hidden><summary id="details-label">Details</summary><pre id="notice-detail"></pre></details></div><main id="timeline"><p class="empty" id="empty">Connect to choose an existing local conversation. Selecting a conversation does not execute it.</p></main>
<div id="approvals"></div><div class="footer"><button id="more" hidden>Older messages</button><button id="return" hidden>Return result to discussion</button><span id="status"></span></div>
<form id="composer"><p id="source" hidden></p><textarea id="draft" aria-label="Message" placeholder="Continue in this Codex conversation…"></textarea><div><select id="model" aria-label="Model"><option value="">Keep conversation model</option></select><button type="button" id="stop" hidden>Stop</button><button type="submit" id="send" disabled>Send to Codex</button></div></form>
<script src="../workbench/markdown.js"></script><script src="app.js"></script></body></html>
