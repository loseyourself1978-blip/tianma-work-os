 language:['Language','语言'],projects:['Projects','项目'],chat:['Conversation','对话'],codex:['Codex execution','Codex 执行'],prototype:['DESIGN PROTOTYPE · No model, tool, upload or code execution takes place.','设计原型 · 不调用模型、工具，不上传资料或执行代码。'],newProject:['New project','新建项目'],importProject:['Import','导入项目'],newChat:['New chat','新建聊天'],localNote:['Local macOS workbench<br>Conversations and execution stay in context.','本机 macOS 工作台<br>对话与执行始终保持上下文。'],allProjects:['My projects','我的项目'],overview:['Overview','概览'],sources:['Sources','资料'],team:['AI team','AI 团队'],tasks:['Tasks','任务'],deliverables:['Deliverables','成果'],introTitle:['What would you like to work on?','今天想推进什么工作？'],intro:['Describe your goal here. Start a conversation now; files and project setup can be added when needed.','直接在下方描述目标，就能开始对话。资料与项目配置可以按需补充，不是开聊前置条件。'],suggest1:['Discuss an improvement before writing code','先讨论一项改进，暂时不写代码'],suggest2:['Explain a screenshot or a document','一起看看截图或文档'],suggest3:['Continue an existing project task','接着推进现有项目任务'],messagePlaceholder:['Message your AI teammate…','向 AI 团队描述你的需求…'],composerNote:['Enter to send · Shift+Enter for a new line · Sending a message does not approve code changes.','Enter 发送 · Shift+Enter 换行 · 发送聊天消息不等于批准代码修改。'],send:['Send','发送'],plugins:['Tools','工具'],route:['AI discussion','AI 对话'],noFiles:['No files required','无需先导入资料'],newChatTitle:['A new conversation','新的对话'],demo:['Demo only','仅演示'],you:['You','你'],assistant:['AI discussion','AI 对话'],reply:['I can help turn this into a clear task. Let’s confirm the desired outcome and constraints here. When the plan is ready, review the exact handoff in the execution pane. No code changes have been started.','可以。我们先在这里明确目标和约束，再整理成可执行任务。准备好后，右侧会展示准确的交接内容供你审查。当前没有启动任何代码修改。'],handoff:['Prepare a Codex handoff','准备交给 Codex'],emptyExecTitle:['Work together, in one place','在同一页，把工作接上'],emptyExec:['Keep discussing on the left while Codex works here. Scope, activity, changes and results will appear in this pane.','中间继续讨 till send a text message.','暂无演示资料，仍然可以直接发送文字。'],allHidden:['Keep at least one pane open.','至少保留一栏展开。'],handoffBusy:['An execution is active. Continue discussing; revise its scope only through a new approval.','当前任务正在执行。可以继续讨论，变更执行范围需要新的明确批准。'],resumeHint:['Conversations stay scoped to each project.','聊天始终绑定各自项目。'],newImported:['Imported project','导入项目'],draftSaved:['Draft remains in this conversation.','草稿保留在当前聊天。'],screenScope:['Demonstrated state, not a live Codex transcript.','这是演示状态，不是真实 Codex 执行日志。']

let lang='en';try{lang=localStorage.getItem('twos20.2.r2.prototype.lang')||'en'}catch{};if(!['en','zh'].includes(lang))lang='en';
const t=k=>D[k]?.[lang==='zh'?1:0]??k;const $=s=>document.querySelector(s);const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let counter=0;const projects=[];const looseChats=[];
let scratch={id:'scratch-1',titleKey:'newChatTitle',draft:'',messages:[],attachments:[],exec:null,plugin:false};
const personal={id:null,name:'',chats:[scratch],open:true};
let pid=null,cid='scratch-1',tab=null,hidden=new Set(),mobile='center',modalKind=null,menu=false,composing=false;
const current=()=>projects.find(p=>p.id===pid)||personal;
const thread=()=>current().chats.find(c=>c.id===cid)||scratch;
const chatTitle=c=>c.titleKey?t(c.titleKey):c.title;

function toast(key){$('#toast').textContent=t(key);$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3000)}
function renderViews(){const def=[['left','projects','panel'],['center','chat','chat'],['right','codex','code']];$('#views').innerHTML=def.map(([p,k,i])=>`<button data-pane="${p}" class="${hidden.has(p)?'':'active'}" aria-pressed="${!hidden.has(p)}" title="${E(t(k))}">${ic(i)}<span>${E(t(k))}</span></button>`).join('');$('#mobile-tabs').innerHTML=def.map(([p,k])=>`<button data-mobile="${p}" class="${mobile===p?'active':''}">${E(t(k))}</button>`).join('');$('#workspace').className='workspace '+Array.from(hidden).map(p=>'hide-'+p).join(' ');$('#workspace').dataset.mobile=mobile}
function renderTree(){$('#tree').innerHTML=projects.map(p=>`<div class="project-item"><button class="project-title ${p.id===pid?'selected':''}" data-project="${p.id}"><span class="caret">${p.open?'⌄':'›'}</span>${ic('folder')}<span>${E(p.name)}</span><span class="count">${p.chats.length}</span></button>${p.open?`<div class="chat-list">${p.chats.map(c=>`<button class="chat-item ${c.id===cid?'selected':''}" data-chat="${c.id}" data-p="${p.id}">${E(chatTitle(c))}</button>`).join('')}<button class="new-chat-side" data-new-chat="${p.id}">${ic('plus')}${E(t('newChat'))}</button></div>`:''}</div>`).join('')}
function renderMessages(){const c=thread();$('#welcome').innerHTML=c.messages.length?'':`<div class="welcome"><div class="spark">${ic('spark')}</div><h2>${E(t('introTitle'))}</h2><p>${E(t('intro'))}</p><div class="suggestions">${[1,2,3].map((n)=>`<button class="suggestion" data-suggest="suggest${n}">${ic(n===2?'image':n===3?'folder':'chat')}<span>${E(t('suggest'+n))}</span><span class="arrow">↗</span></button>`).join('')}</div></div>`;$('#messages').innerHTML=c.messages.map(m=>`<article class="message ${m.role}"><div class="who">${m.role==='assistant'?ic('spark'):''}${E(t(m.role==='user'?'you':'assistant'))}${m.role==='assistant'?`<span class="demo-label">${E(t('demo'))}</span>`:''}</div><div class="body">${E(m.key?t(m.key):m.text)}</div>${m.attachments?.length?`<div class="small muted">${E(m.attachments.join(' · '))}</div>`:''}${m.handoff?`<div class="tools"><button class="handoff-btn" data-handoff="1">${E(t('handoff'))} ↗</button></div>`:''}</article>`).join('');$('#conversation-heading').innerHTML=`<strong>${E(chatTitle(c))}</strong><span class="badge">${E(t('noFiles'))}</span>`}
function renderAttachments(){$('#attachments').innerHTML=thread().attachments.map((a,n)=>`<div class="chip">${a.url?`<img src="${a.url}" alt="${E(a.name)}">`:ic('file')}<span>${E(a.name)}</span><button data-remove="${n}" aria-label="${E(t('removeAttachment'))}">×</button></div>`).join('');updateSend()}
function updateSend(){$('#send').disabled=!$('#draft').value.trim()&&!thread().attachments.length}
function renderRight(){const e=thread().exec;$('#right-head').innerHTML=`${ic('code')}<strong>${E(t('codex'))}</strong><span class="grow"></span><span class="badge">${E(t('demo'))}</span><button class="icon" data-action="collapse-right" title="${E(t('codex'))}">›</button>`;$('#right-foot').textContent=t('rightFoot');if(!e){$('#right-body').innerHTML=`<div class="execution-empty"><div class="execution-icon">${ic('code')}</div><h3>${E(t('emptyExecTitle'))}</h3><p>${E(t('emptyExec'))}</p></div><div class="stage-map">${[1,2,3].map(i=>`<div><span class="step-no">${i}</span><span>${E(t('step'+i))}</span></div>`).join('')}</div><div class="provider-note">${E(t('connectedNotice'))}</div>`;return}$('#right-body').innerHTML=`<div class="exec-card"><div class="row spread"><span class="pill">${E(t(e.status))}</span><span class="small muted">DEMO-01</span></div><h3>${E(t('execTitle'))}</h3><p>${E(t('execScope'))}</p><dl class="execution-facts"><dt>${E(t('target'))}</dt><dd>${E(t('targetValue'))}</dd><dt>${E(t('allowed'))}</dt><dd>${E(t('allowedValue'))}</dd><dt>${E(t('reviewer'))}</dt><dd>${E(t('reviewValue'))}</dd></dl>${e.status==='reviewNeeded'?`<button class="primary" data-exec="approve">${E(t('approve'))}</button>`:e.status==='approved'?`<button class="primary" data-exec="start">${E(t('start'))}</button>`:e.status==='running'?`<button class="secondary" data-exec="stop">${E(t('stop'))}</button>`:''}</div>${e.events.length?`<div class="timeline">${e.events.map(i=>`<div class="event">${E(t('event'+i))}<code>${E(t('execLog'+i))}</code></div>`).join('')}</div>`:''}${e.status==='done'?`<div class="exec-card"><div class="label">${E(t('viewChanges'))}</div><pre class="diff">${E(t('sampleDiff'))}</pre><div class="small muted">${E(t('screenScope'))}</div></div>`:''}`}
function renderDetail(){const active=!!tab;$('#detail').classList.toggle('active',active);for(const id of ['conversation-heading','chat-region','composer-area'])$('#'+id).style.display=active?'none':'';if(!active)return;$('#detail').innerHTML=`<button class="back" id="back-workbench">${ic('back')}${E(t('back'))}</button><h2>${E(t(tab))}</h2><p>${E(t('detailDescription'))}</p><div class="detail-card"><div class="label">${E(current().name)}</div><p>${E(t(({overview:'overviewDesc',sources:'sourceDesc',team:'teamDesc',tasks:'tasksDesc',deliverables:'deliverDesc'})[tab]))}</p>${tab==='sources'?`<button class="secondary" id="detail-attach">${E(t('addFiles'))}</button>`:tab==='team'?`<div class="empty-note">${E(t('connectedNotice'))}</div>`:tab==='tasks'?`<div class="empty-note">${E(thread().exec?t(thread().exec.status):t('emptyExecTitle'))}</div>`:tab==='deliverables'?`<div class="empty-note">${E(t('demo'))}</div>`:''}</div>`}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('#lang').value=lang;$('#lang-label').textContent=t('language');$('#proto-banner').textContent=t('prototype');$('#projects-label').textContent=t('projects');$('#hide-left').innerHTML=ic('panel');$('#hide-left').title=t('projects');$('#new-project').innerHTML=ic('plus')+E(t('newProject'));$('#import-project').innerHTML=ic('upload')+E(t('importProject'));$('#local-note').innerHTML=t('localNote');$('#crumb').innerHTML=`${E(t('allProjects'))}<span>/</span>${E(current().name)}`;$('#project-name').textContent=current().name;$('#nav').innerHTML=['overview','sources','team','tasks','deliverables'].map(k=>`<button data-tab="${k}">${E(t(k))}</button>`).join('');$('#draft').placeholder=t('messagePlaceholder');$('#draft').setAttribute('aria-label',t('messagePlaceholder'));$('#draft').value=thread().draft;$('#add-input').innerHTML=ic('plus');$('#add-input').title=t('addFiles');$('#plugin-button').innerHTML=ic('link')+E(t('plugins'))+(thread().plugin?' · 1':'');$('#route-button').innerHTML=ic('spark')+E(t('route'));$('#send').innerHTML=E(t('send'))+ic('arrow');$('#composer-note').textContent=t('composerNote');$('#add-menu').innerHTML=['addImage','addFiles','useSources'].map((k,i)=>`<button data-add="${k}">${ic(i===0?'image':i===1?'file':'folder')}${E(t(k))}</button>`).join('');renderViews();renderTree();renderMessages();renderAttachments();renderRight();renderDetail();if(modalKind)renderModal()}
function saveDraft(){thread().draft=$('#draft').value}
function selectChat(p,c){saveDraft();pid=p;cid=c;current().open=true;tab=null;mobile='center';render()}
function newChat(p){saveDraft();const c={id:'chat-'+(++counter),titleKey:'newChatTitle',draft:'',messages:[],attachments:[],exec:null};const proj=projects.find(x=>x.id===p);proj.chats.push(c);selectChat(p,c.id);$('#draft').focus()}
function send(){if(composing||$('#send').disabled)return;const c=thread();const text=$('#draft').value.trim();if(c.titleKey&&text){c.title=text.slice(0,30);delete c.titleKey}c.messages.push({role:'user',text:text||t('addFiles'),attachments:c.attachments.map(a=>a.name)});c.attachments.forEach(a=>{if(a.url)URL.revokeObjectURL(a.url)});c.attachments=[];c.draft='';c.messages.push({role:'assistant',key:'reply',handoff:true});render();$('#chat-region').scrollTop=$('#chat-region').scrollHeight;$('#draft').focus()}
function togglePane(p){if(!hidden.has(p)&&hidden.size===2){toast('allHidden');return}hidden.has(p)?hidden.delete(p):hidden.add(p);if(p==='center'&&hidden.has('center'))hidden.delete('right');renderViews()}
function prepare(){if(thread().exec?.status==='running'){toast('handoffBusy');return}thread().exec={status:'reviewNeeded',events:[]};hidden.delete('right');mobile=window.innerWidth<=760?'right':mobile;renderViews();renderRight()}
function execAction(a){const c=thread();if(!c.exec)return;if(a==='approve'&&c.exec.status==='reviewNeeded'){c.exec.status='approved';renderRight()}if(a==='start'&&c.exec.status==='approved'){c.exec.status='running';c.exec.events=[0];renderRight();for(let i=1;i<=4;i++)setTimeout(()=>{if(c.exec?.status!=='running')return;c.exec.events.push(i);if(i===4){c.exec.status='done';c.messages.push({role:'assistant',key:'returned'})}if(thread()===c){renderRight();renderMessages()}},i*1900)}if(a==='stop'){c.exec.status='cancelled';renderRight()}}
let modalInput='',lastFocus;
function openModal(kind){modalKind=kind;modalInput='';lastFocus=document.activeElement;renderModal();$('#modal-mask').hidden=false;setTimeout(()=>($('#project-input')||$('#close-modal')).focus(),0)}
function closeModal(){modalKind=null;$('#modal-mask').hidden=true;lastFocus?.focus?.()}

 }
 if(authStep==='signup-password'){
  if(authFields.password.length<12){authErrorSet('passwordShort');return}
  if(demoAccounts.get(email)?.verified){authErrorSet('emailTaken');return}
  const hash=await digest(authFields.password);authFields.password='';demoAccounts.set(email,{hash,verified:false,workspace:null});issueCode('signup');return;
 }
 if(authStep==='login-password'){
  const hash=await digest(authFields.password);authFields.password='';const a=demoAccounts.get(email);
  if(!a||a.hash!==hash){authErrorSet('invalidCredentials');return}if(!a.verified){issueCode('signup');return}enterWorkspace(email);return;
 }
 if(authStep==='verify'){
  const v=verification;if(!v||v.attempts>=5){authErrorSet('verifyFailed');return}v.attempts++;
  if(Date.now()>v.expires||authFields.code!==v.code||email!==v.email){authErrorSet('invalidCode');return}
  if(pendingPurpose==='reset'){if(!demoAccounts.has(email)){authErrorSet('invalidCode');return}verification=null;authFields.password='';authFields.confirm='';authGo('reset-password');return}
  const a=demoAccounts.get(email);if(!a){authErrorSet('invalidCode');return}a.verified=true;verification=null;authFields.code='';authGo('verified');return;
 }
 if(authStep==='reset-password'){
  if(authFields.password.length<12){authErrorSet('passwordShort');return}if(authFields.password!==authFields.confirm){authErrorSet('passwordMismatch');return}
  const a=demoAccounts.get(email);if(!a){authErrorSet('invalidCredentials');return}a.hash=await digest(authFields.password);authFields.password='';authFields.confirm='';authStep='login';authNotice='resetDone';renderAuth();
 }
}
const baseRender=render,baseViews=renderViews,baseTree=renderTree,baseMessages=renderMessages,baseModal=renderModal,baseAddProject=addProject,baseSend=send,basePrepare=prepare;
renderViews=function(){baseViews();const home=pid===null;$('#workspace').classList.toggle('home-layout',home);$('#workspace').classList.toggle('landing',home&&!thread().messages.length);if(home){$('#views [data-pane="right"]')?.remove();$('#mobile-tabs [data-mobile="right"]')?.remove();if(mobile==='right')mobile='center';$('#workspace').dataset.mobile=mobile}$('#views').hidden=!signedIn;$('#mobile-tabs').hidden=!signedIn;$('#account-button').hidden=!signedIn;};
renderTree=function(){baseTree();if(looseChats.length){$('#tree').insertAdjacentHTML('beforeend',`<span class="label loose-label">${E(t('recentChats'))}</span>${looseChats.map(c=>`<button class="chat-item ${cid===c.id&&pid===null?'selected':''}" data-loose="${c.id}">${E(chatTitle(c))}</button>`).join('')}`)}};
renderMessages=function(){baseMessages();if(pid===null&&!thread().messages.length){$('#welcome').innerHTML=`<div class="welcome"><h2><span class="slogan-brand">TWOS</span>${E(t('slogan'))}</h2></div>`;}if(pid===null&&thread().messages.length){$('#conversation-heading').innerHTML=`<strong>${E(chatTitle(thread()))}</strong><button class="secondary small" data-save-project="1">${E(t('saveToProject'))}</button>`}};
render=function(){baseRender();document.title=lang==='zh'?'TWOS · 从想法开始 · R2 交互原型':'TWOS · Start with an idea · R2 prototype';$('#workspace').hidden=!signedIn;$('#auth-screen').hidden=signedIn;$('#proto-banner').innerHTML=`<span class="safety">${E(t('prototype'))}</span><span class="revision">20.2 / R2</span>`;$('#preview-nav').innerHTML=`<option value="" selected>${E(t('screenPreview'))}</option><option value="auth">${E(t('authPreview'))}</option><option value="home">${E(t('homePreview'))}</option><option value="work">${E(t('workPreview'))}</option>`;$('#preview-nav').setAttribute('aria-label',t('screenPreview'));$('#account-button').title=t('accountTitle');if(pid===null){$('#draft').placeholder=t('starter');$('#draft').setAttribute('aria-label',t('starter'));if(!thread().messages.length)$('#composer-note').textContent=t('homeNote')}$('#send').setAttribute('aria-label',t('send'));$('#close-modal').setAttribute('aria-label',t('cancel'));if(!signedIn)renderAuth()};
send=function(){if(!signedIn)return;const c=thread();if(pid===null&&!looseChats.some(x=>x.id===c.id)&&($('#draft').value.trim()||c.attachments.length)){looseChats.push(c);if(!personal.chats.some(x=>x.id===c.id))personal.chats.push(c)}baseSend()};
prepare=function(){if(pid===null){openModal('save-project');return}basePrepare()};
addProject=function(name){const old=thread();const preserving=modalKind==='save-project';baseAddProject(name);if(preserving){const p=current();p.chats=[old];cid=old.id;const ix=looseChats.indexOf(old);if(ix>=0)looseChats.splice(ix,1);personal.chats=personal.chats.filter(x=>x!==old);if(old===scratch)scratch=makeChat();if(!personal.chats.some(x=>x.id===scratch.id))personal.chats.unshift(scratch);render()}};
renderModal=function(){if(['account','connect','save-project'].includes(modalKind)){
 const k=modalKind;$('#modal-title').textContent=t(k==='account'?'accountTitle':k==='connect'?'connectTitle':'noProjectHandoff');
 $('#modal-content').innerHTML=k==='account'?`<div class="auth-email-pill">${E(accountEmail||'demo@example.com')}</div><p>${E(t('accountNote'))}</p>`:k==='connect'?`<p>${E(t('connectDesc'))}</p><div class="empty-note">${E(t('connectedNotice'))}</div>`:`<p>${E(t('noProjectDesc'))}</p><label for="project-input">${E(t('projectLabel'))}</label><input id="project-input" value="${E(modalInput)}" autocomplete="off">`;
 $('#modal-footer').innerHTML=k==='account'?`<button class="secondary" data-auth="logout">${E(t('signOut'))}</button><button class="primary" data-modal="cancel">${E(t('doneButton'))}</button>`:k==='connect'?`<button class="primary" data-modal="cancel">${E(t('connectPreview'))}</button>`:`<button class="secondary" data-modal="cancel">${E(t('cancel'))}</button><button class="primary" data-modal="create">${E(t('create'))}</button>`;
 return;
 }baseModal()};
$('#lang').onchange=e=>{if(signedIn)saveDraft();else authCapture();if($('#project-input'))modalInput=$('#project-input').value;lang=e.target.value;try{localStorage.setItem('twos20.2.r2.prototype.lang',lang)}catch{}render()};
$('#home-button').onclick=()=>{if(!signedIn){authGo('welcome');return}saveDraft();if(scratch.messages.length)scratch=makeChat();pid=null;personal.chats=[scratch,...looseChats.filter(c=>c.id!==scratch.id)];cid=scratch.id;tab=null;mobile='center';render()};
$('#route-button').onclick=()=>openModal('connect');$('#account-button').onclick=()=>openModal('account');
function previewHome(){if(signedIn)snapshotDemo();accountEmail='preview@example.com';signedIn=true;resetWorkspace();render()}
function previewWork(){previewHome();projects.push({id:'demo-development',name:'TWOS Development',open:true,chats:[{id:'demo-chat',title:lang==='zh'?'改进空白首页':'Improve the empty home screen',draft:'',attachments:[],messages:[{role:'user',text:lang==='zh'?'我想让新用户登录后直接输入想法，不再先填项目表单。':'Let new users start with an idea after signing in, without filling out a project form first.'},{role:'assistant',key:'reply',handoff:true}],exec:null,plugin:false}]});pid='demo-development';cid='demo-chat';hidden.clear();render()}
$('#preview-nav').onchange=e=>{const v=e.target.value;if(v==='auth')logout();if(v==='home')previewHome();if(v==='work')previewWork()};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.show){const inp=$('#'+b.dataset.show);inp.type=inp.type==='password'?'text':'password';b.textContent=t(inp.type==='password'?'showPassword':'hidePassword')}
 if(b.dataset.auth){const a=b.dataset.auth;
  if(['signup','login','reset'].includes(a)){authGo(a)}
  if(a==='back')authGo(authStep==='signup-password'?'signup':authStep==='login-password'?'login':'welcome');
  if(a==='change-email')authGo(pendingPurpose==='reset'?'reset':authStep==='login-password'?'login':'signup');
  if(a==='inbox'){authCapture();demoMailOpen=!demoMailOpen;renderAuth()}
  if(a==='resend'){authCapture();if(verification&&Date.now()-verification.sent<30000){authErrorSet('rateCode')}else{issueCode(pendingPurpose);authNotice='resendDone';renderAuth()}}
  if(a==='enter')enterWorkspace(authFields.email.trim().toLowerCase());
  if(a==='logout')logout();
 }
 if(b.dataset.loose){saveDraft();pid=null;cid=b.dataset.loose;personal.chats=[scratch,...looseChats.filter(c=>c.id!==scratch.id)];tab=null;mobile='center';render()}
 if(b.dataset.saveProject)openModal('save-project');
});
$('#send').onclick=()=>send();
// URL hash is a DESIGN preview shortcut, never an authentication capability.
if(location.hash==='#home')previewHome();else if(location.hash==='#work')previewWork();else render();

</script></body></html>
