<!doctype html><html lang="en" data-twos-fixture-provider="ChatGPT"><meta charset="utf-8">
<title>Offline member sign-in fixture</title>
<header><button data-testid="login-button">Log in</button></header>
<main><form><textarea id="prompt-textarea"></textarea><button data-testid="send-button" aria-label="Send" type="button">Send</button></form></main>
<script>
let deliveries=0;
const header=document.querySelector('header'),input=document.querySelector('textarea');
const signIn=()=>{
  sessionStorage.setItem('fixture-signed-in','1');
  header.replaceChildren();
  const account=document.createElement('button');
  account.dataset.testid='accounts-profile-button';account.textContent='Local test profile';header.append(account);
};
document.querySelector('[data-testid=login-button]').onclick=signIn;
if(sessionStorage.getItem('fixture-signed-in'))signIn();
document.querySelector('[data-testid=send-button]').onclick=()=>{
  const sent=document.createElement('article');sent.dataset.messageAuthorRole='user';sent.dataset.messageId='user-'+(deliveries+1);
  sent.textContent=input.value;input.value='';document.querySelector('form').before(sent);deliveries++;
  history.pushState(null,'','/c/first-send-fixture');
  const answer=document.createElement('article');answer.dataset.messageAuthorRole='assistant';answer.dataset.messageId='assistant-'+deliveries;
  answer.textContent=JSON.stringify({mode:'answer',text:'Synthetic connection check complete.'});
  sent.after(answer);
};
</script></html>
